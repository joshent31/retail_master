[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "retail_ops"
authors = [{ name = "Retail Ops", email = "dev@example.com" }]
description = "Offline-first multi-branch and multi-warehouse retail POS for Frappe / ERPNext v16"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Frappe",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/your-org/retail_ops"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501", "F401"]
